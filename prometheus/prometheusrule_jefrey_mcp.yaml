# P6.3 — Kubernetes PrometheusRule CRD for Jefrey MCP Gateway
#
# Apply with: kubectl apply -f prometheusrule_jefrey_mcp.yaml
# Requires: Prometheus Operator (monitoring.coreos.com/v1)
#
# This creates a PrometheusRule resource that the Prometheus Operator
# will automatically load into the managed Prometheus instance.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jefrey-mcp-alerts
  namespace: monitoring  # adjust to your monitoring namespace
  labels:
    app: jefrey-mcp
    prometheus: k8s  # match your Prometheus instance selector
    role: alert-rules
spec:
  groups:
    - name: jefrey-mcp-health
      interval: 30s
      rules:
        - alert: JefreyMCPAPIServiceDown
          expr: jefrey_service_health{component="api"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Jefrey API service is down"
            description: "API health check has been 0 for 1 minute. Check container logs and restart if needed."
            runbook_url: "https://github.com/your-org/jefrey/runbooks/api-down"

        - alert: JefreyMCPServerServiceDown
          expr: jefrey_service_health{component="mcp"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Jefrey MCP Server is down"
            description: "MCP Server health check has been 0 for 1 minute. Tool execution unavailable."

        - alert: JefreyN8nBridgeServiceDown
          expr: jefrey_service_health{component="bridge"} == 0
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "n8n Bridge unhealthy"
            description: "Bridge health check failing. n8n workflows may not execute. Check n8n connectivity."

        - alert: JefreyMCPHighToolErrorRate
          expr: |
            (
              sum(rate(jefrey_mcp_tool_calls_total{status="error"}[5m])) by (tool_name)
              /
              sum(rate(jefrey_mcp_tool_calls_total[5m])) by (tool_name)
            ) > 0.1
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High error rate on MCP tool {{ $labels.tool_name }}"
            description: "Error rate > 10% for tool {{ $labels.tool_name }} over 5 minutes."

    - name: jefrey-mcp-performance
      interval: 30s
      rules:
        - alert: JefreyMCPToolHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(jefrey_mcp_tool_latency_seconds_bucket[5m])) by (le, tool_name)
            ) > 10
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High latency on MCP tool {{ $labels.tool_name }}"
            description: "p95 latency > 10s for tool {{ $labels.tool_name }} over 5 minutes."

        - alert: JefreyMCPToolVeryHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(jefrey_mcp_tool_latency_seconds_bucket[5m])) by (le, tool_name)
            ) > 30
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Critical latency on MCP tool {{ $labels.tool_name }}"
            description: "p95 latency > 30s for tool {{ $labels.tool_name }}. Immediate investigation required."

        - alert: JefreyMCPToolThroughputDrop
          expr: |
            sum(rate(jefrey_mcp_tool_calls_total[5m])) by (tool_name)
              < 0.01 * sum(rate(jefrey_mcp_tool_calls_total[1h])) by (tool_name)
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Tool throughput dropped significantly"
            description: "Tool {{ $labels.tool_name }} throughput dropped > 99% compared to 1h average."

    - name: jefrey-mcp-security
      interval: 30s
      rules:
        - alert: JefreyMCPOAuthInvalidTokenSpike
          expr: |
            rate(jefrey_mcp_oauth_validations_total{result="invalid"}[5m]) > 10
          for: 2m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "OAuth invalid token spike detected"
            description: "High rate of invalid OAuth tokens (>10/min). Possible brute force or token leakage."

        - alert: JefreyMCPOAuthMissingTokenSpike
          expr: |
            rate(jefrey_mcp_oauth_validations_total{result="missing"}[5m]) > 20
          for: 5m
          labels:
            severity: info
            team: security
          annotations:
            summary: "High rate of missing OAuth tokens"
            description: "Clients calling MCP without auth. Check client integration."

        - alert: JefreyMCPRateLimitDenialSpike
          expr: |
            rate(jefrey_mcp_rate_limit_decisions_total{decision="deny"}[5m]) > 5
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Rate limit denials spike"
            description: "High rate of rate limit denials (>5/min). Check for abusive clients or adjust limits."

        - alert: JefreyMCPToolsBlockedSpike
          expr: |
            rate(jefrey_tools_blocked_total[5m]) > 5
          for: 2m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Policy engine blocking many tools"
            description: "High rate of tools blocked by policy (>5/min). Review policy rules or client behavior."

        - alert: JefreyMCPHitlApprovalsPending
          expr: |
            rate(jefrey_approvals_created_total[5m]) - rate(jefrey_approvals_decided_total[5m]) > 10
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "HITL approvals accumulating"
            description: "More approvals created than decided. Human reviewers may be overwhelmed or notifications failing."

    - name: jefrey-mcp-operations
      interval: 60s
      rules:
        - alert: JefreyMCPCacheLowHitRate
          expr: |
            jefrey_mcp_cache_hits_total / (jefrey_mcp_cache_hits_total + jefrey_mcp_cache_misses_total) < 0.5
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "MCP discovery cache hit rate low"
            description: "Cache hit rate < 50%. Cache may be too small or TTL too short."

        - alert: JefreyN8nBridgeExecutionFailures
          expr: |
            rate(jefrey_mcp_bridge_executions_total{status="error"}[5m]) > 2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "n8n Bridge execution failures"
            description: "Bridge workflow executions failing > 2/min. Check n8n connectivity and workflow configs."

        - alert: JefreyN8nBridgeTimeoutSpike
          expr: |
            rate(jefrey_mcp_bridge_executions_total{status="timeout"}[5m]) > 1
          for: 3m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "n8n Bridge timeouts spike"
            description: "Bridge workflows timing out > 1/min. Check n8n performance and timeout configs."

        - alert: JefreyN8nBridgeHitlRejections
          expr: |
            rate(jefrey_mcp_bridge_executions_total{status="hitl_rejected"}[5m]) > 0.5
          for: 5m
          labels:
            severity: info
            team: platform
          annotations:
            summary: "Bridge workflows rejected by HITL"
            description: "Human reviewers rejecting bridge workflows. Review workflow risk classifications."

        - alert: JefreyLLMHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(jefrey_llm_latency_seconds_bucket[5m])) by (le, provider, model)
            ) > 30
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High LLM latency ({{ $labels.provider }}/{{ $labels.model }})"
            description: "p95 LLM latency > 30s. Check provider status and consider fallback."

        - alert: JefreyMemoryHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(jefrey_memory_latency_seconds_bucket[5m])) by (le, operation, layer)
            ) > 5
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High memory operation latency ({{ $labels.operation }}/{{ $labels.layer }})"
            description: "p95 memory latency > 5s. Check PostgreSQL/pgvector performance."