# docker/prometheus/tests/alerts_test.yml — P5-04 firing drill 6/6 (Livro4 cap10 p.228 promtool test rules)
# Formato correto promtool 2.53: rule_files -> evaluation_interval -> tests[].alert_rule_test[]
# Axiom #1 FAIL-CLOSED + cap5 cardinality 1 serie/alert sem user_id + cap6 by(le)
rule_files:
  - ../alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'jefrey_config_valid'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: JefreyConfigInvalid
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: config
            exp_annotations:
              summary: "Jefrey config invalida (CIPHER-002/019)"
              description: "CONFIG_VALID==0 ha 1m - checar JEFREY_ENV, HMAC, OAUTH AUD/ISS, REDIS_PASSWORD. Fail-closed ativo."
  - interval: 1m
    input_series:
      - series: 'jefrey_tools_blocked_total{tool_name="memory.search",reason="policy"}'
        values: '0+10x10'
      - series: 'jefrey_tool_exec_latency_seconds_count{tool_name="memory.search"}'
        values: '0+100x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: JefreyApiHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: error_rate
            exp_annotations:
              summary: "Error rate >1% (SLO 1.3)"
              description: "tools_blocked / tool_exec >1% ha 5m - ver PolicyEngine, guard, rate_limit."
  - interval: 1m
    input_series:
      - series: 'jefrey_rate_limit_total{tool_name="memory.search",decision="deny"}'
        values: '0+1x10'
      - series: 'jefrey_rate_limit_total{tool_name="memory.search",decision="allow"}'
        values: '0+100x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: JefreyRateLimitDenialsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: rate_limit
            exp_annotations:
              summary: "Rate-limit deny >0.1% (SLO 1.3)"
              description: "RATE_LIMIT deny ratio >0.1% - revisar rate_limit_max/window ou abuso por user_id/tool."
  - interval: 1m
    input_series:
      - series: 'jefrey_eventbus_kid_legacy_total'
        values: '0+5x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: JefreyKidLegacyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: eventbus
            exp_annotations:
              summary: "EventBus kid legacy >10/10m"
              description: "Mensagens sem kid (v0) altas - rotacao HMAC incompleta. Ver ADR-001, plan dual-verify->publish v2."
  - interval: 1m
    input_series:
      - series: 'jefrey_memory_latency_seconds_bucket{le="0.1",operation="search",layer="episodic"}'
        values: '0+1x10'
      - series: 'jefrey_memory_latency_seconds_bucket{le="0.3",operation="search",layer="episodic"}'
        values: '0+1x10'
      - series: 'jefrey_memory_latency_seconds_bucket{le="0.5",operation="search",layer="episodic"}'
        values: '0+1x10'
      - series: 'jefrey_memory_latency_seconds_bucket{le="+Inf",operation="search",layer="episodic"}'
        values: '0+100x10'
      - series: 'jefrey_memory_latency_seconds_count{operation="search",layer="episodic"}'
        values: '0+100x10'
      - series: 'jefrey_memory_latency_seconds_sum{operation="search",layer="episodic"}'
        values: '0+90x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: JefreyMemoryLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: latency
            exp_annotations:
              summary: "Memory p95 >300ms (SLO 1.2)"
              description: "pgvector HNSW p95 >300ms - ver docs/HNSW_TUNING.md ef 64 vs 200, pool_pre_ping/recycle."
  - interval: 1m
    input_series:
      - series: 'up{job="jefrey-api"}'
        values: '1+0x2 0+0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: JefreyServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: availability
              job: "jefrey-api"
            exp_annotations:
              summary: "jefrey-api down"
              description: "Up==0 ha 1m - checar docker logs jefrey-api, health /health, postgres/redis health."
