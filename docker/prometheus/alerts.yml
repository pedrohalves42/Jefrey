groups:
  - name: jefrey.slo
    interval: 30s
    rules:
      - alert: JefreyConfigInvalid
        expr: jefrey_config_valid == 0
        for: 1m
        labels:
          severity: critical
          slo: config
        annotations:
          summary: "Jefrey config invalida (CIPHER-002/019)"
          description: "CONFIG_VALID==0 ha 1m - checar JEFREY_ENV, HMAC, OAUTH AUD/ISS, REDIS_PASSWORD. Fail-closed ativo."

      - alert: JefreyApiHighErrorRate
        expr: |
          sum(rate(jefrey_tools_blocked_total[5m])) /
          clamp_min(sum(rate(jefrey_tool_exec_latency_seconds_count[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: warning
          slo: error_rate
        annotations:
          summary: "Error rate >1% (SLO 1.3)"
          description: "tools_blocked / tool_exec >1% ha 5m - ver PolicyEngine, guard, rate_limit."

      - alert: JefreyRateLimitDenialsHigh
        expr: |
          sum(rate(jefrey_rate_limit_total{decision="deny"}[5m])) /
          clamp_min(sum(rate(jefrey_rate_limit_total[5m])), 1) > 0.001
        for: 5m
        labels:
          severity: warning
          slo: rate_limit
        annotations:
          summary: "Rate-limit deny >0.1% (SLO 1.3)"
          description: "RATE_LIMIT deny ratio >0.1% - revisar rate_limit_max/window ou abuso por user_id/tool."

      - alert: JefreyKidLegacyHigh
        expr: increase(jefrey_eventbus_kid_legacy_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          slo: eventbus
        annotations:
          summary: "EventBus kid legacy >10/10m"
          description: "Mensagens sem kid (v0) altas - rotacao HMAC incompleta. Ver ADR-001, plan dual-verify->publish v2."

      - alert: JefreyMemoryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(jefrey_memory_latency_seconds_bucket[5m])) by (le)) > 0.3
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Memory p95 >300ms (SLO 1.2)"
          description: "pgvector HNSW p95 >300ms - ver docs/HNSW_TUNING.md ef 64 vs 200, pool_pre_ping/recycle."

      - alert: JefreyServiceDown
        expr: up{job="jefrey-api"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "jefrey-api down"
          description: "Up==0 ha 1m - checar docker logs jefrey-api, health /health, postgres/redis health."
