# =============================================================================
# JEFREY — Prometheus Configuration (P6 + P4-04 alerts)
# Scrape interval: 15s (default). Retention: 30d.
# Target: jefrey-api:8000 (FastAPI container)
# Alerts: docker/prometheus/alerts.yml (P4-04)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Jefrey API — FastAPI com /metrics endpoint
  - job_name: "jefrey-api"
    scrape_interval: 10s
    static_configs:
      - targets: ["jefrey-api:8000"]
    metrics_path: "/metrics"
