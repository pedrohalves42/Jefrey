# =============================================================================
# ARGOCD APPLICATION - Jefrey Production
# GitOps continuous deployment
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jefrey-prod
  namespace: argocd
  labels:
    app: jefrey
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: production
  source:
    repoURL: https://github.com/your-org/jefrey.git
    targetRevision: main
    path: k8s/overlays/prod
    kustomize:
      version: v5.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: jefrey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Ignore replica count changes from HPA
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Ignore image digest changes (handled by image updater)
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/*/image
    # Ignore PVC capacity changes
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
  revisionHistoryLimit: 10
---
# =============================================================================
# ARGOCD APPLICATION - Jefrey Staging
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jefrey-staging
  namespace: argocd
  labels:
    app: jefrey
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: staging
  source:
    repoURL: https://github.com/your-org/jefrey.git
    targetRevision: develop
    path: k8s/overlays/staging
    kustomize:
      version: v5.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: jefrey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/*/image
  revisionHistoryLimit: 5
---
# =============================================================================
# ARGOCD PROJECT - Production
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production
  namespace: argocd
  labels:
    environment: production
spec:
  description: Production project for Jefrey
  sourceRepos:
    - https://github.com/your-org/jefrey.git
  destinations:
    - namespace: jefrey
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
  roles:
    - name: admin
      description: Full access to production
      policies:
        - p, proj:production:admin, applications, *, production/*, allow
      groups:
        - platform-team
    - name: readonly
      description: Read-only access
      policies:
        - p, proj:production:readonly, applications, get, production/*, allow
      groups:
        - developers
---
# =============================================================================
# ARGOCD PROJECT - Staging
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: staging
  namespace: argocd
  labels:
    environment: staging
spec:
  description: Staging project for Jefrey
  sourceRepos:
    - https://github.com/your-org/jefrey.git
  destinations:
    - namespace: jefrey
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
  roles:
    - name: admin
      description: Full access to staging
      policies:
        - p, proj:staging:admin, applications, *, staging/*, allow
      groups:
        - platform-team
        - developers
    - name: readonly
      description: Read-only access
      policies:
        - p, proj:staging:readonly, applications, get, staging/*, allow
      groups:
        - all-developers