# Alertmanager Configuration
# Routes alerts from Prometheus to notification channels
# Apply: kubectl create secret generic alertmanager-config --from-file=alertmanager.yml -n monitoring
---
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'  # CHANGE: your SMTP server
  smtp_from: 'alerts@your-domain.com'   # CHANGE: sender email
  smtp_auth_username: 'alerts@your-domain.com'
  smtp_auth_password: '${SMTP_PASSWORD}'  # From secret
  smtp_require_tls: true

  # Slack webhook (set via secret)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # PagerDuty
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

templates:
  - '/etc/alertmanager/template/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    # Warning alerts - batched
    - match:
        severity: warning
      receiver: 'warning-alerts'
    # Info alerts - low priority
    - match:
        severity: info
      receiver: 'info-alerts'
    # Dead man's switch / watchdog
    - match:
        alertname: 'Watchdog'
      receiver: 'watchdog'

receivers:
  - name: 'default'
    email_configs:
      - to: 'oncall@your-domain.com'
        send_resolved: true
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-oncall@your-domain.com'
        send_resolved: true
        html: '{{ template "email.default.html" . }}'
    slack_configs:
      - channel: '#critical-alerts'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}**{{ .Labels.alertname }}** on {{ .Labels.instance }}\n{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY}'
        severity: critical
        details:
          firing: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'team@your-domain.com'
        send_resolved: true
    slack_configs:
      - channel: '#warnings'
        send_resolved: true
        title: '⚠️ WARNING: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}**{{ .Labels.alertname }}** on {{ .Labels.instance }}\n{{ .Annotations.description }}{{ end }}'
        color: 'warning'

  - name: 'info-alerts'
    slack_configs:
      - channel: '#info'
        send_resolved: true
        title: 'ℹ️ INFO: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'watchdog'
    # Dead man's switch - alerts if Alertmanager stops receiving Watchdog
    email_configs:
      - to: 'oncall@your-domain.com'
        send_resolved: true

inhibit_rules:
  # Inhibit warning if critical is firing for same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit info if warning is firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit all if Watchdog is firing (Alertmanager down)
  - source_match:
      alertname: 'Watchdog'
    target_match_re:
      alertname: '.*'
    equal: ['cluster']