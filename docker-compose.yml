# =============================================================================
# JEFREY � Stack de infraestrutura
# Fase P1: PostgreSQL 16 + pgvector (mem�ria vetorial + relacional) e Redis (working memory)
# Fase P3a: MCP Gateway (servidor dedicado streamable-http :8001, healthcheck /health)
# Fase P3b: n8n (Event Router :5678, healthcheck /healthz, importa workflow versionado)
# Fase P6: Observability (Prometheus :9090 + Grafana :3000)
# =============================================================================
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: jefrey-postgres
    env_file: [.env]
    environment:
      POSTGRES_USER: ${JEFREY_DATABASE__USER:-jefrey}
      POSTGRES_PASSWORD: ${JEFREY_DATABASE__PASSWORD:?required}
      POSTGRES_DB: ${JEFREY_DATABASE__DB:-jefrey}
    ports:
      - "5432:5432"
    volumes:
      - jefrey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jefrey -d jefrey"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: jefrey-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${JEFREY_REDIS__PASSWORD:?required}"]
    env_file: [.env]
    environment:
      JEFREY_REDIS__PASSWORD: ${JEFREY_REDIS__PASSWORD:?required}
    ports:
      - "6379:6379"
    volumes:
      - jefrey_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$${JEFREY_REDIS__PASSWORD:?required}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P5 � FastAPI Server (servi�o paralelo ao MCP Gateway)
  # API REST unificada: /chat (ass�ncrono com HITL), /memory, /approvals, /health.
  # Porta 8000 (MCP Server fica na 8001).
  # ---------------------------------------------------------------------------
  jefrey-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: jefrey-api:local
    container_name: jefrey-api
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    volumes:
      - ./:/app:ro
    env_file: [.env]
    environment:
      JEFREY_DATABASE__URL: postgresql+psycopg://${JEFREY_DATABASE__USER:-jefrey}:${JEFREY_DATABASE__PASSWORD:?required}@postgres:5432/${JEFREY_DATABASE__DB:-jefrey}
      JEFREY_REDIS__URL: redis://:${JEFREY_REDIS__PASSWORD:?required}@redis:6379/0
      JEFREY_DATABASE__HOST: ${JEFREY_DATABASE__HOST:-postgres}
      JEFREY_REDIS__HOST: ${JEFREY_REDIS__HOST:-redis}
      JEFREY_REDIS__PASSWORD: ${JEFREY_REDIS__PASSWORD:?required}
      JEFREY_LLM__MODEL: ${JEFREY_LLM__MODEL:-qwen2:0.5b}
      JEFREY_LLM__BASE_URL: ${JEFREY_LLM__BASE_URL:-http://host.docker.internal:11434}
      JEFREY_EMBEDDINGS__BASE_URL: ${JEFREY_EMBEDDINGS__BASE_URL:-http://host.docker.internal:11434}
      JEFREY_API__SECRET_KEY: ${JEFREY_API__SECRET_KEY}
      JEFREY_API__AUDIT_FALLBACK_PATH: ${JEFREY_API__AUDIT_FALLBACK_PATH:-/app/data/audit_fallback.jsonl}
      JEFREY_ENV: ${JEFREY_ENV:-dev}
      JEFREY_EVENTBUS__HMAC_KEY: ${JEFREY_EVENTBUS__HMAC_KEY:?required em prod � ver .env.example}
      JEFREY_EVENTBUS__HMAC_KEYS_JSON: ${JEFREY_EVENTBUS__HMAC_KEYS_JSON:-}
      JEFREY_EVENTBUS__HMAC_KID: ${JEFREY_EVENTBUS__HMAC_KID:-v1}
      JEFREY_OAUTH__CLIENT_ID: ${JEFREY_OAUTH__CLIENT_ID:-}
      JEFREY_OAUTH__CLIENT_SECRET: ${JEFREY_OAUTH__CLIENT_SECRET:-}
      JEFREY_OAUTH__TOKEN_URI: ${JEFREY_OAUTH__TOKEN_URI:-}
      JEFREY_OAUTH__AUD: ${JEFREY_OAUTH__AUD:-}
      JEFREY_OAUTH__ISS: ${JEFREY_OAUTH__ISS:-}
      JEFREY_OAUTH__JWKS_URI: ${JEFREY_OAUTH__JWKS_URI:-}
      JEFREY_API__CORS_ORIGINS: ${JEFREY_API__CORS_ORIGINS:-}
      JEFREY_DEBUG: "false"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P3a � MCP Gateway (processo separado do agente)
  # Exp�e as ferramentas do SkillRegistry via streamable-http na porta 8001.
  # Cada ferramenta passa pelo PolicyEngine (thread_id vem do request MCP).
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: jefrey-mcp:local
    container_name: jefrey-mcp
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    volumes:
      - ./:/app:ro
    env_file: [.env]
    environment:
      JEFREY_DATABASE__URL: postgresql+psycopg://${JEFREY_DATABASE__USER:-jefrey}:${JEFREY_DATABASE__PASSWORD:?required}@postgres:5432/${JEFREY_DATABASE__DB:-jefrey}
      JEFREY_REDIS__URL: redis://:${JEFREY_REDIS__PASSWORD:?required}@redis:6379/0
      JEFREY_DATABASE__HOST: ${JEFREY_DATABASE__HOST:-postgres}
      JEFREY_REDIS__HOST: ${JEFREY_REDIS__HOST:-redis}
      JEFREY_REDIS__PASSWORD: ${JEFREY_REDIS__PASSWORD:?required}
      JEFREY_LLM__MODEL: ${JEFREY_LLM__MODEL:-qwen2:0.5b}
      JEFREY_LLM__BASE_URL: ${JEFREY_LLM__BASE_URL:-http://host.docker.internal:11434}
      JEFREY_EMBEDDINGS__BASE_URL: ${JEFREY_EMBEDDINGS__BASE_URL:-http://host.docker.internal:11434}
      JEFREY_MCP__HOST: ${JEFREY_MCP__HOST:-0.0.0.0}
      JEFREY_MCP__PORT: ${JEFREY_MCP__PORT:-8001}
      JEFREY_ENV: ${JEFREY_ENV:-dev}
      JEFREY_EVENTBUS__HMAC_KEY: ${JEFREY_EVENTBUS__HMAC_KEY:?required em prod � ver .env.example}
      JEFREY_EVENTBUS__HMAC_KEYS_JSON: ${JEFREY_EVENTBUS__HMAC_KEYS_JSON:-}
      JEFREY_EVENTBUS__HMAC_KID: ${JEFREY_EVENTBUS__HMAC_KID:-v1}
      JEFREY_OAUTH__CLIENT_ID: ${JEFREY_OAUTH__CLIENT_ID:-}
      JEFREY_OAUTH__CLIENT_SECRET: ${JEFREY_OAUTH__CLIENT_SECRET:-}
      JEFREY_OAUTH__TOKEN_URI: ${JEFREY_OAUTH__TOKEN_URI:-}
      JEFREY_OAUTH__AUD: ${JEFREY_OAUTH__AUD:-}
      JEFREY_OAUTH__ISS: ${JEFREY_OAUTH__ISS:-}
      JEFREY_OAUTH__JWKS_URI: ${JEFREY_OAUTH__JWKS_URI:-}
      JEFREY_API__CORS_ORIGINS: ${JEFREY_API__CORS_ORIGINS:-}
      JEFREY_DEBUG: "false"
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P3b � n8n (Event Router)
  # Recebe eventos via Webhook /webhook/jefrey-events, roteia por event_type
  # (Switch) e chama o Jefrey MCP Server (http://mcp-server:8001) via HTTP
  # Request nodes falando o protocolo MCP streamable-http (JSON-RPC, Accept JSON).
  # O workflow versionado em n8n/workflows/ e importado no startup
  # (N8N_WORKFLOWS_IMPORT_FOLDER) � se o volume morrer, n�o se perde o workflow.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: jefrey-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HEALTHY_CHECK_PATH: "/healthz"
      WEBHOOK_URL: "http://localhost:5678/"
    volumes:
      - jefrey_n8n_data:/home/node/.n8n
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P6 � Observabilidade (Prometheus + Grafana)
  # Prometheus: scrape jefrey-api:8000/metrics, ret�m 30 dias.
  # Grafana: provisiona datasource Prometheus + dashboard Jefrey (6 pain�is).
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jefrey-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - jefrey_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: jefrey-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jefrey.json
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - jefrey_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jefrey_pgdata:
  jefrey_redisdata:
  jefrey_n8n_data:
  jefrey_prometheus_data:
  jefrey_grafana_data:
