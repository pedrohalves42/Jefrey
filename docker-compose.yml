# =============================================================================
# JEFREY — Stack de infraestrutura
# Fase P1: PostgreSQL 16 + pgvector (memória vetorial + relacional) e Redis (working memory)
# Fase P3a: MCP Gateway (servidor dedicado streamable-http :8001, healthcheck /health)
# Fase P3b: n8n (Event Router :5678, healthcheck /healthz, importa workflow versionado)
# =============================================================================
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: jefrey-postgres
    environment:
      POSTGRES_USER: jefrey
      POSTGRES_PASSWORD: jefrey
      POSTGRES_DB: jefrey
    ports:
      - "5432:5432"
    volumes:
      - jefrey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jefrey -d jefrey"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: jefrey-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - jefrey_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P5 — FastAPI Server (serviço paralelo ao MCP Gateway)
  # API REST unificada: /chat (assíncrono com HITL), /memory, /approvals, /health.
  # Porta 8000 (MCP Server fica na 8001).
  # ---------------------------------------------------------------------------
  jefrey-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: jefrey-api:local
    container_name: jefrey-api
    working_dir: /app
    volumes:
      - .:/app
    environment:
      JEFREY_DATABASE__URL: postgresql+psycopg://jefrey:jefrey@postgres:5432/jefrey
      JEFREY_REDIS__URL: redis://redis:6379/0
      JEFREY_DATABASE__HOST: postgres
      JEFREY_REDIS__HOST: redis
      JEFREY_EMBEDDINGS__BASE_URL: http://host.docker.internal:11434
      JEFREY_API__SECRET_KEY: ${JEFREY_API__SECRET_KEY}
      JEFREY_API__AUDIT_FALLBACK_PATH: /app/data/audit_fallback.jsonl
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P3a — MCP Gateway (processo separado do agente)
  # Expõe as ferramentas do SkillRegistry via streamable-http na porta 8001.
  # Cada ferramenta passa pelo PolicyEngine (thread_id vem do request MCP).
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: jefrey-mcp:local
    container_name: jefrey-mcp
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # Em Docker usamos os hostnames dos serviços (postgres/redis). As URLs completas
      # têm precedência sobre o .env (que aponta para localhost) e sobrescrevem o
      # JEFREY_DATABASE__HOST/REDIS__HOST para o networking interno do compose.
      JEFREY_DATABASE__URL: postgresql+psycopg://jefrey:jefrey@postgres:5432/jefrey
      JEFREY_REDIS__URL: redis://redis:6379/0
      JEFREY_DATABASE__HOST: postgres
      JEFREY_REDIS__HOST: redis
      # Embeddings: o MCP Server roda em container; Ollama sobe na HOST (Windows).
      # host.docker.internal resolve para a host em Docker Desktop e está confirmado
      # acessível (testado: 200 OK de dentro do container). Sem isso, save_note etc.
      # falham com "Failed to connect to Ollama" dentro do container.
      JEFREY_EMBEDDINGS__BASE_URL: http://host.docker.internal:11434
      JEFREY_MCP__HOST: 0.0.0.0
      JEFREY_MCP__PORT: 8001
    ports:
      - "8001:8001"
    # CIPHER-014: resolve host.docker.internal no Linux via host-gateway
    # (no-op no Windows Docker Desktop, que já resolve nativamente). Sem condicionais.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Fase P3b — n8n (Event Router)
  # Recebe eventos via Webhook /webhook/jefrey-events, roteia por event_type
  # (Switch) e chama o Jefrey MCP Server (http://mcp-server:8001) via HTTP
  # Request nodes falando o protocolo MCP streamable-http (JSON-RPC, Accept JSON).
  # O workflow versionado em n8n/workflows/ e importado no startup
  # (N8N_WORKFLOWS_IMPORT_FOLDER) — se o volume morrer, não se perde o workflow.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: jefrey-n8n
    ports:
      - "5678:5678"
    environment:
      # Autenticação (P3b): n8n 2.36 usa User Management (owner + API key) para a REST API.
      # O básico legado N8N_BASIC_AUTH_* está descontinuado e NÃO autentica a API nesta
      # versão (testado: 401 em /api/v1/*). Por isso desligamos o básico e usamos
      # owner (email/senha) + API key gerada em runtime (verify_p3b). O editor e a
      # instância seguem autenticados — equivalente seguro ao pedido original.
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HEALTHY_CHECK_PATH: "/healthz"
      WEBHOOK_URL: "http://localhost:5678/"
      # NOTA (Decisão 2 do P3b): o workflow versionado fica em n8n/workflows/ (no repo).
      # O auto-import via N8N_WORKFLOWS_IMPORT_FOLDER foi DESLIGADO porque recriava o
      # workflow a cada startup e conflitava no path do webhook (/webhook/jefrey-events)
      # com a importação idempotente do verify_p3b via API (find-or-create por nome +
      # activate). O JSON versionado no repo cumpre o intento de "não perder o workflow
      # se o volume morrer".
    volumes:
      - jefrey_n8n_data:/home/node/.n8n
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  jefrey_pgdata:
  jefrey_redisdata:
  jefrey_n8n_data:
