<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jefrey 3D Avatar</title>
  <!-- v1b-cache-bust 2026-09-12 -->
  <link rel="icon" href="data:,">
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
    <style>
    *{box-sizing:border-box}
    body{margin:0;overflow:hidden;background:radial-gradient(1200px 800px at 30% 20%, #0e2a4a 0%, #0f1419 45%, #080c10 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e0e0e0}
    /* PREMIUM GLASS - backdrop-blur 16px saturated */
    #ui{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:10;background:rgba(15,20,25,0.72);padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06)}
    #ui::before{content:'';position:absolute;inset:0;border-radius:14px;padding:1px;background:linear-gradient(135deg, rgba(10,132,255,0.18), transparent 55%);-webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    button{padding:8px 14px;background:linear-gradient(180deg,#0a84ff,#0668cc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:650;font-size:13px;box-shadow:0 2px 10px rgba(10,132,255,0.35), inset 0 1px 0 rgba(255,255,255,0.2);transition:transform 0.12s, box-shadow 0.12s}
    button:hover{background:linear-gradient(180deg,#1a90ff,#075ec0);transform:translateY(-1px);box-shadow:0 6px 18px rgba(10,132,255,0.45)}
    button:active{transform:translateY(0)}
    button:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    #btnMic.recording{background:linear-gradient(180deg,#ff453a,#d12a20);animation:pulse 1s infinite;box-shadow:0 0 0 0 rgba(255,59,48,0.5)}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,0.55)}70%{box-shadow:0 0 0 10px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
    #status{font-size:12px;opacity:0.92;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,0.6)}
    #player{width:220px;height:28px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.35))}
    #canvas{display:block;width:100vw;height:100vh}
    /* CHAT premium - glass + typewriter ready */
    #chatPanel{position:absolute;bottom:14px;left:14px;right:14px;max-width:580px;margin:0 auto;z-index:10;background:rgba(15,20,25,0.78);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05)}
    #chatLog{max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px;font-size:13px;line-height:1.5;scrollbar-width:thin;scrollbar-color:#243140 transparent}
    .msg{padding:8px 11px;border-radius:10px;max-width:85%;word-break:break-word;animation:msgIn 0.18s ease-out}
    @keyframes msgIn{from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;background:linear-gradient(180deg,#0a84ff,#075ec0);color:#fff;box-shadow:0 4px 14px rgba(10,132,255,0.3)}
    .msg.jefrey{align-self:flex-start;background:rgba(30,42,51,0.95);color:#cfe6ff;border:1px solid rgba(38,53,69,0.9);box-shadow:0 4px 14px rgba(0,0,0,0.25)}
    .msg.jefrey.typing::after{content:'▌';animation:blink 1s step-end infinite;margin-left:2px}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .msg.jefrey pre{background:#0d1117;border:1px solid #1e2a33;border-radius:8px;padding:8px 10px;overflow-x:auto;margin:6px 0 0 0;font-size:12px}
    .msg.jefrey code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
    .msg.sys{align-self:center;background:rgba(26,26,26,0.9);color:#9aa0a6;font-size:11px;border:1px solid rgba(255,255,255,0.06)}
    #chatRow{display:flex;gap:8px;align-items:center}
    #chatInput{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(36,49,64,0.9);background:rgba(13,17,23,0.95);color:#e0e0e0;outline:none;transition:border-color 0.14s, box-shadow 0.14s}
    #chatInput:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,0.18)}
    #chatInput::placeholder{color:#6b7a8a}
    #btnSend{white-space:nowrap}
    #avatarFallback{position:absolute;inset:0;display:none;place-items:center;z-index:5;pointer-events:none;background:radial-gradient(520px 520px at 50% 55%, rgba(10,132,255,0.10), transparent 70%)}
    #avatarFallback span{width:110px;height:160px;border-radius:18px;background:linear-gradient(180deg,#0a84ff,#083a6b);display:block;animation:float 2.2s ease-in-out infinite;box-shadow:0 18px 40px rgba(10,132,255,0.35), 0 0 0 1px rgba(255,255,255,0.08) inset}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    /* WAVEFORM canvas for mic */
    #waveform{width:140px;height:28px;border-radius:8px;background:rgba(13,17,23,0.9);border:1px solid rgba(36,49,64,0.7);display:none}
    #toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(15,20,25,0.92);border:1px solid rgba(255,255,255,0.08);padding:7px 12px;border-radius:8px;font-size:12px;display:none;backdrop-filter:blur(10px)}
  </style>
</head>
<body>
<div id="ui">
  <h3 style="margin:0;font-size:15px">Jefrey <span id="userId">guest</span></h3>
  <button id="btnAvatar">Trocar Avatar</button>
  <button id="btnMic" title="Clique para falar (5s)">🎤 Falar</button>
  <span id="status">pronto — digite no chat ou clique em Falar</span>
  <audio id="player" controls style="display:none"></audio>
</div>
<div id="avatarFallback"><span></span></div>
<div id="toast"></div>
<canvas id="canvas"></canvas>

<div id="chatPanel">
  <div id="chatLog">
    <div class="msg sys">Conectado em <b>http://localhost:3001</b> — backend em :8000. Digite ou use o microfone.</div>
  </div>
  <div id="chatRow">
    <input id="chatInput" placeholder="Digite sua mensagem e tecle Enter..." autocomplete="off" />
    <button id="btnSend">Enviar</button>
  </div>
</div>

<script type="module">
// --- Config ---
const TOKEN = localStorage.getItem('jefrey_token') || '73a63e869da21db4d478e1ec1b453111257c12371d8aca44751405270ee049e3';
const userId = localStorage.getItem('jefrey_user_id') || 'demo_user';
document.getElementById('userId').textContent = userId;
const API_BASE = (window.JEFREY_API_URL || 'http://localhost:8000').replace(/\/$/,'');
const WS_URL = window.JEFREY_WS_URL || 'ws://localhost:8000/ws';

function toast(msg, ms=3000){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>el.style.display='none', ms);
}
function setStatus(msg){ document.getElementById('status').textContent = msg; }
function addMsg(text, who){
  const log=document.getElementById('chatLog');
  const d=document.createElement('div');
  d.className='msg '+who;
  d.textContent=text;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

// --- CHAT (independe de Three.js) ---
async function sendChat(text){
  text=(text||'').trim();
  if(!text) return;
  const input=document.getElementById('chatInput');
  addMsg(text,'user');
  if(input) input.value='';
  setStatus('pensando...');
  try{
    const r=await fetch(`${API_BASE}/chat`,{
      method:'POST',
      headers:{ Authorization:`Bearer ${TOKEN}`, 'X-User-Id': userId, 'Content-Type':'application/json' },
      body: JSON.stringify({message:text})
    });
    if(!r.ok){
      const t=await r.text();
      throw new Error(`chat ${r.status}: ${t.slice(0,200)}`);
    }
    const j=await r.json();
    const reply=j.response || j.message || j.text || JSON.stringify(j).slice(0,400);
    addMsg(reply,'jefrey');
    setStatus('resposta recebida');
    // TTS da resposta do chat tbm
    try{ await speakText(reply); }catch(e){ console.warn('tts do chat falhou',e); }
  }catch(e){
    console.error(e);
    addMsg('Erro: '+ (e.message||e).slice(0,160),'sys');
    toast(String(e.message||e).slice(0,120));
    setStatus('erro no chat');
  }
}
document.getElementById('btnSend').addEventListener('click',()=> sendChat(document.getElementById('chatInput').value));
document.getElementById('chatInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter') sendChat(e.target.value); });

// --- VOZ ---
const btnMic = document.getElementById('btnMic');
const player = document.getElementById('player');

  // DIFF1 waveform for mic (isolated, no dependency)
  let waveCtx = null, waveAnalyser = null, waveRAF = null;
  function startWaveform(stream){
    try{
      const cvs = document.getElementById('waveform');
      if(!cvs) return;
      cvs.style.display = 'block';
      waveCtx = cvs.getContext('2d');
      const ac = new (window.AudioContext||window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(stream);
      waveAnalyser = ac.createAnalyser();
      waveAnalyser.fftSize = 256;
      src.connect(waveAnalyser);
      const data = new Uint8Array(waveAnalyser.frequencyBinCount);
      (function draw(){
        if(!waveAnalyser) return;
        waveRAF = requestAnimationFrame(draw);
        waveAnalyser.getByteFrequencyData(data);
        waveCtx.clearRect(0,0,cvs.width,cvs.height);
        waveCtx.fillStyle = 'rgba(13,17,23,0.9)';
        waveCtx.fillRect(0,0,cvs.width,cvs.height);
        const barW = cvs.width / data.length * 2.2;
        let x=0;
        for(let i=0;i<data.length;i+=4){
          const h = data[i]/255 * cvs.height*0.85;
          waveCtx.fillStyle = `rgba(10,132,255,${0.35 + data[i]/255*0.65})`;
          waveCtx.fillRect(x, cvs.height - h, barW, h);
          x += barW+1;
          if(x > cvs.width) break;
        }
      })();
    }catch(e){ console.log('waveform failed', e); }
  }
  function stopWaveform(){
    try{ if(waveRAF) cancelAnimationFrame(waveRAF); }catch(e){}
    waveRAF=null; waveAnalyser=null;
    const cvs=document.getElementById('waveform');
    if(cvs){ const ctx=cvs.getContext('2d'); ctx.clearRect(0,0,cvs.width,cvs.height); cvs.style.display='none'; }
  }

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
let rec=null, chunks=[], analyser=null;

let lipSource = null;
function startLipSync(audioEl){
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    // Evita InvalidStateError se ja conectado: desconecta anterior e reusa
    try{ if(lipSource) lipSource.disconnect(); }catch(e){}
    try{ if(analyser) analyser.disconnect(); }catch(e){}
    // Se audioEl ja tem source, tenta desconectar - nao da para desfazer, mas guard resolve
    if(audioEl._jefreyConnected){
      // Ja conectado anteriormente, apenas reusa analyser sem recriar source
      if(analyser){
        const data = new Uint8Array(analyser.frequencyBinCount);
        function tick(){
          if(!analyser || audioEl.paused) return;
          analyser.getByteFrequencyData(data);
          const avg = data.reduce((a,b)=>a+b,0)/data.length;
          const s = 1 + Math.min(0.12, avg/600);
          if(window.avatarMesh) window.avatarMesh.scale.set(s,s,s);
          requestAnimationFrame(tick);
        }
        tick();
        audioEl.onended = ()=>{ if(window.avatarMesh) window.avatarMesh.scale.set(1,1,1); };
      }
      return;
    }
    const src = audioCtx.createMediaElementSource(audioEl);
    audioEl._jefreyConnected = true;
    lipSource = src;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function tick(){
      if(!analyser || audioEl.paused) return;
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0)/data.length;
      const s = 1 + Math.min(0.12, avg/600);
      if(window.avatarMesh) window.avatarMesh.scale.set(s,s,s);
      requestAnimationFrame(tick);
    }
    tick();
    audioEl.onended = ()=>{ if(window.avatarMesh) window.avatarMesh.scale.set(1,1,1); };
  }catch(e){ console.warn('lip-sync falhou', e); }
}
async function speakText(text){
  text=String(text).slice(0,1000);
  if(!text) return;
  setStatus('sintetizando voz...');
  const tts = await fetch(`${API_BASE}/tts`,{
    method:'POST',
    headers:{ Authorization:`Bearer ${TOKEN}`, 'X-User-Id': userId, 'Content-Type':'application/json' },
    body: JSON.stringify({text, voice_id:'pt_BR-faber-medium', format:'wav'})
  });
  if(!tts.ok){ const txt=await tts.text(); throw new Error(`TTS ${tts.status}: ${txt.slice(0,200)}`); }
  const blob=await tts.blob();
  const url=URL.createObjectURL(blob);
  player.src=url;
  player.style.display='block';
  player.onloadeddata=()=>{ player.play().catch(()=>toast('Clique no player para ouvir.')); startLipSync(player); };
  setTimeout(()=>{ if(player.paused) player.play().catch(()=>{}); }, 300);
  setStatus('tocando resposta...');
  if(window.avatarMesh) window.avatarMesh.rotation.y+=0.15;
}
btnMic.onclick = async ()=>{
  if(audioCtx.state==='suspended') await audioCtx.resume();
  if(rec && rec.state==='recording'){ rec.stop(); btnMic.classList.remove('recording'); btnMic.textContent='🎤 Falar'; setStatus('processando...'); return; }
  try{
    if(!navigator.mediaDevices?.getUserMedia){ toast('Navegador sem microfone. Use Chrome/Edge.'); return; }
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    rec = new MediaRecorder(stream,{mimeType:mime});
    rec.ondataavailable=e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    rec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      btnMic.disabled=true;
      try{
        const blob=new Blob(chunks,{type:'audio/webm'}); chunks=[];
        if(blob.size<500){ toast('Audio muito curto, fale 1-5s.'); setStatus('pronto'); return; }
        setStatus('transcrevendo...');
        const fd=new FormData(); fd.append('audio',blob,'mic.webm');
        const r=await fetch(`${API_BASE}/stt`,{ method:'POST', headers:{ Authorization:`Bearer ${TOKEN}`, 'X-User-Id': userId }, body:fd });
        if(!r.ok){ const txt=await r.text(); throw new Error(`STT ${r.status}: ${txt.slice(0,200)}`); }
        const {transcript}=await r.json();
        if(!transcript){ toast('Nao entendi, tente novamente.'); setStatus('pronto'); return; }
        setStatus(`voce: "${transcript.slice(0,60)}"`);
        addMsg(transcript,'user');
        // chat + tts via funcao existente
        await sendChat(transcript);
      }catch(err){ console.error(err); toast(String(err.message||err).slice(0,120)); setStatus('erro - tente novamente'); }
      finally{ btnMic.disabled=false; btnMic.classList.remove('recording'); btnMic.textContent='🎤 Falar'; }
    };
    rec.start(100);
    btnMic.classList.add('recording'); btnMic.textContent='⏹ Parar (5s)'; setStatus('gravando... clique em Parar'); toast('Gravando - fale agora');
    setTimeout(()=>{ if(rec && rec.state==='recording') rec.stop(); },5000);
  }catch(e){
    console.error(e);
    if(e.name==='NotAllowedError') toast('Permissao de microfone negada.');
    else if(e.name==='NotFoundError') toast('Microfone nao encontrado.');
    else toast(`Microfone erro: ${e.message}`);
    setStatus('pronto'); btnMic.classList.remove('recording'); btnMic.textContent='🎤 Falar';
  }
};
window.jefreyVoice={ getState:()=>({recording: rec && rec.state==='recording'}) };

// --- 3D ISOLADO (nao quebra chat/voz se CDN falhar) ---
const canvas=document.getElementById('canvas');
let avatarMesh=null;
window.avatarMesh=null;
let threeReady=false;

async function init3D(){
  try{
    const THREE = await import('three');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0f1419);
    const camera=new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0,1.35,3.8);
    const controls=new OrbitControls(camera, renderer.domElement);
    controls.enableDamping=true; controls.target.set(0,0.9,0);
    scene.add(new THREE.HemisphereLight(0xffffff,0x223344,1.1));
    const dir=new THREE.DirectionalLight(0xffffff,0.9); dir.position.set(4,6,4); scene.add(dir);
    // box fallback imediato
    avatarMesh=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.2,0.3), new THREE.MeshStandardMaterial({color:0x0a84ff}));
    avatarMesh.position.y=0.9;
    scene.add(avatarMesh); window.avatarMesh=avatarMesh;
    // animacao base
    let t=0;
    const animate=()=>{ requestAnimationFrame(animate); t+=0.01; if(avatarMesh) avatarMesh.rotation.y+=0.003; controls.update(); try{ const _t=performance.now()*0.001; const _m=window.avatarMesh; if(_m && _m.scale) _m.scale.y=1+Math.sin(_t*0.9)*0.015; /* breath idle */ }catch(e){}; renderer.render(scene,camera); // DIFF1 breath idle };
    animate();
    window.addEventListener('resize',()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    // tenta glTF por cima
    const loader=new GLTFLoader();
    loader.load('/data/avatars/iron_man.glTF',(gltf)=>{
      scene.remove(avatarMesh);
      avatarMesh=gltf.scene; avatarMesh.position.y=0; window.avatarMesh=avatarMesh; scene.add(avatarMesh);
      addMsg('Avatar 3D carregado.','sys'); console.log('iron_man.glTF carregado');
    }, undefined, (err)=>{ console.warn('GLTF fallback mantido',err); addMsg('Avatar box (GLTF offline).','sys'); });
        // WS movido para fora do init3D (DIFF1b) - antes dentro causava readyState 3 quando CDN lento
    document.getElementById('avatarFallback').style.display='none';
    document.getElementById('btnAvatar').addEventListener('click',()=>toast('Troca via JEFREY_AVATAR__MODEL no backend.'));
    threeReady=true;
    setStatus('3D pronto — chat e voz ativos');
  }catch(e){
    console.error('3D falhou — fallback 2D ativo',e);
    document.getElementById('avatarFallback').style.display='grid';
    addMsg('3D offline (CDN bloqueado) — chat e voz continuam funcionando.','sys');
    setStatus('modo 2D — chat e voz OK');
    document.getElementById('btnAvatar').addEventListener('click',()=>toast('3D offline — avatar 2D ativo.'));
  }
}
init3D();

// DIFF1b: WS fora do init3D com reconexao (nao depende de Three.js)
(function connectWS(){
  let retries=0;
  function open(){
    try{
      const ws=new WebSocket(WS_URL);
      ws.onopen=()=>{ console.log('WS open',WS_URL); retries=0; setStatus('conectado'); };
      ws.onmessage=(e)=>{
        try{
          const msg=JSON.parse(e.data);
          const m=window.avatarMesh;
          if(msg.type==='tool_start' && m) m.rotation.y+=0.06;
          if(msg.type==='memory_retrieved' && m){ m.scale.set(1.06,1.06,1.06); setTimeout(()=>m.scale.set(1,1,1),280); }
          if(msg.type==='approval_pending' || msg.type==='security_alert'){ toast(msg.type); if(m) m.traverse(o=>o.isMesh && o.material && o.material.color && o.material.color.set(0xff3b30)); }
        }catch(err){ console.warn('WS parse',err); }
      };
      ws.onerror=(e)=>{ console.warn('WS error',e); };
      ws.onclose=()=>{
        console.log('WS closed, retry in', Math.min(5000, 1000*(retries+1)));
        if(retries<10){ retries++; setTimeout(open, 1000*(retries)); } else { setStatus('WS offline - recarregue'); }
      };
    }catch(e){ console.warn('WS falhou',e); setTimeout(open, 2000); }
  }
  open();
})();

console.log('Jefrey UI pronta: chat + btnMic + 3D isolado (nao quebra se CDN falhar)');
</script>
</body>
</html>
