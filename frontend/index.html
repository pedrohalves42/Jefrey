<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jefrey 3D Avatar</title>
  <style>
    body{margin:0;overflow:hidden;background:#111;font-family:system-ui,sans-serif;color:#e0e0e0}
    #ui{position:absolute;top:20px;left:20px;display:flex;gap:12px;align-items:center}
    button{padding:8px 16px;background:#0f0;border:none;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
<div id="ui">
  <h3>Jefrey <span id="userId">guest</span></h3>
  <button id="btnAvatar">Trocar Avatar</button>
</div>
<canvas id="canvas"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0,1.5,4);
const controls = new OrbitControls(camera, renderer.domElement);
const hem = new THREE.HemisphereLight(0xffffff,0x444444,1); scene.add(hem);
const dir = new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(5,5,5); scene.add(dir);

let avatarMesh = null;
const loader = new GLTFLoader();
loader.load('/data/avatars/iron_man.glTF', (gltf)=>{
  avatarMesh = gltf.scene;
  avatarMesh.name='avatar';
  scene.add(avatarMesh);
});

const ws = new WebSocket('ws://localhost:8000/ws');
ws.onmessage = (e)=>{
  try{
    const msg = JSON.parse(e.data);
    console.log('Jefrey event:',msg.type);
    if(msg.type==='tool_start'){ if(avatarMesh){ avatarMesh.rotation.y+=0.02; } }
    if(msg.type==='memory_retrieved'){ /* pulse effect */ }
    if(msg.type==='approval_pending'){ if(avatarMesh){ avatarMesh.traverse(o=>{ if(o.isMesh) o.material.color.set(0xff0000); }); } }
    if(msg.type==='security_alert'){ if(avatarMesh){ avatarMesh.traverse(o=>{ if(o.isMesh) o.material.color.set(0xff0000); }); } }
  }catch(err){ console.error('WS msg parse error',err); }
};

const animate=()=>{ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); };
animate();

document.getElementById('btnAvatar').addEventListener('click',()=>{
  alert('Troca de avatar configurada via JEFREY_AVATAR__MODEL no backend.');
});
</script>
</body>
</html>
