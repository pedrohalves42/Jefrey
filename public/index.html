<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jefrey — Assistente AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    :root {
      --primary: #06b6d4;
      --primary-glow: rgba(6, 182, 212, 0.4);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-deep: #030712;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-glass: rgba(17, 24, 39, 0.4);
      --text: #f1f5f9;
      --text-muted: #64748b;
      --border: rgba(148, 163, 184, 0.1);
      --aurora-1: #06b6d4;
      --aurora-2: #8b5cf6;
      --aurora-3: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════ AURORA BACKGROUND ═══════════════ */
    #aurora-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      overflow: hidden;
    }
    #aurora-bg::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
      animation: aurora-drift 20s ease-in-out infinite alternate;
    }
    @keyframes aurora-drift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-3%, 2%) rotate(3deg); }
    }

    /* ═══════════════ PARTICLES CANVAS ═══════════════ */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* ═══════════════ LAYOUT ═══════════════ */
    .app-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ═══════════════ HEADER ═══════════════ */
    header {
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    }
    .status-text { font-size: 12px; color: var(--text-muted); }

    /* ═══════════════ 3D BRAIN AREA ═══════════════ */
    #brain-container {
      position: relative;
      width: 100%;
      height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    #brain-canvas {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #brain-label {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-glass);
      padding: 4px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
    }

    /* ═══════════════ CHAT AREA ═══════════════ */
    .chat-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 20px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      animation: msg-in 0.3s ease-out;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }
    
    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .message.user .msg-avatar {
      background: linear-gradient(135deg, var(--primary), #0891b2);
    }
    .message.bot .msg-avatar {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
    }

    .msg-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .message.user .msg-bubble {
      background: linear-gradient(135deg, var(--primary), #0891b2);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .message.user .msg-time { text-align: right; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing-bounce 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ═══════════════ INPUT AREA ═══════════════ */
    .input-area {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }

    .msg-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .msg-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .msg-input::placeholder { color: var(--text-muted); }

    .btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-send {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px var(--primary-glow);
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-mic {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-mic:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .btn-mic.recording {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: var(--danger);
      animation: mic-pulse 1s infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }

    /* ═══════════════ EMPTY STATE ═══════════════ */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .empty-state p { font-size: 14px; }

    /* ═══════════════ RESPONSIVE ═══════════════ */
    @media (max-width: 768px) {
      #brain-container { height: 200px; }
      .msg-bubble { max-width: 85%; }
      header { padding: 12px 0; }
    }
  </style>
</head>
<body>
  <canvas id="aurora-bg"></canvas>
  <canvas id="particles"></canvas>

  <div class="app-container">
    <header>
      <div class="logo">
        <div class="logo-icon">🧠</div>
        <h1>Jefrey</h1>
      </div>
      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Conectando...</span>
      </div>
    </header>

    <div id="brain-container">
      <canvas id="brain-canvas"></canvas>
      <div id="brain-label">🧠 Rede Neural • Neural Network Visualization</div>
    </div>

    <div class="chat-wrapper">
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state" id="emptyState">
          <div class="emoji">🤖</div>
          <h3>Ola! Sou o Jefrey</h3>
          <p>Digite uma mensagem ou clique no microfone para falar</p>
        </div>
      </div>

      <div class="input-area">
        <input type="text" class="msg-input" id="msgInput" 
               placeholder="Digite sua mensagem..." autocomplete="off">
        <button class="btn btn-mic" id="micBtn" title="Microfone">🎤</button>
        <button class="btn btn-send" id="sendBtn" title="Enviar">➤</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ═══════════════ CONFIG ═══════════════
    const API_BASE = window.location.origin;
    let TOKEN = null;
    let isRecording = false;
    let recognition = null;

    // ═══════════════ THREE.JS — 3D BRAIN ═══════════════
    const brainCanvas = document.getElementById('brain-canvas');
    const brainContainer = document.getElementById('brain-container');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, brainContainer.clientWidth / brainContainer.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 4);

    const renderer = new THREE.WebGLRenderer({ canvas: brainCanvas, antialias: true, alpha: true });
    renderer.setSize(brainContainer.clientWidth, brainContainer.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const controls = new OrbitControls(camera, brainCanvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // Neural network nodes
    const nodesGroup = new THREE.Group();
    scene.add(nodesGroup);
    
    // Create neural network visualization
    const nodePositions = [];
    const nodeCount = 80;
    const nodeGeom = new THREE.SphereGeometry(0.03, 8, 8);
    
    for (let i = 0; i < nodeCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 1.2 + Math.random() * 0.6;
      
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi);
      
      const hue = 0.5 + Math.random() * 0.3; // cyan to purple
      const color = new THREE.Color().setHSL(hue, 0.8, 0.6);
      
      const mat = new THREE.MeshBasicMaterial({ 
        color,
        transparent: true,
        opacity: 0.4 + Math.random() * 0.4
      });
      const mesh = new THREE.Mesh(nodeGeom, mat);
      mesh.position.set(x, y, z);
      nodesGroup.add(mesh);
      nodePositions.push({ x, y, z, mesh, baseOpacity: mat.opacity, hue });
    }

    // Connection lines
    const lineMaterial = new THREE.LineBasicMaterial({ 
      color: 0x06b6d4, 
      transparent: true, 
      opacity: 0.08 
    });
    
    const connections = [];
    for (let i = 0; i < nodeCount; i++) {
      for (let j = i + 1; j < nodeCount; j++) {
        const dx = nodePositions[i].x - nodePositions[j].x;
        const dy = nodePositions[i].y - nodePositions[j].y;
        const dz = nodePositions[i].z - nodePositions[j].z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        if (dist < 0.8) {
          const geom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(nodePositions[i].x, nodePositions[i].y, nodePositions[i].z),
            new THREE.Vector3(nodePositions[j].x, nodePositions[j].y, nodePositions[j].z),
          ]);
          const line = new THREE.Line(geom, lineMaterial.clone());
          nodesGroup.add(line);
          connections.push({ line, i, j, baseOpacity: 0.08 });
        }
      }
    }

    // Core glow sphere
    const coreGeom = new THREE.IcosahedronGeometry(0.3, 2);
    const coreMat = new THREE.MeshBasicMaterial({ 
      color: 0x06b6d4, 
      transparent: true, 
      opacity: 0.15,
      wireframe: true 
    });
    const core = new THREE.Mesh(coreGeom, coreMat);
    nodesGroup.add(core);

    // Inner core
    const innerGeom = new THREE.SphereGeometry(0.15, 16, 16);
    const innerMat = new THREE.MeshBasicMaterial({ 
      color: 0x8b5cf6, 
      transparent: true, 
      opacity: 0.3 
    });
    const innerCore = new THREE.Mesh(innerGeom, innerMat);
    nodesGroup.add(innerCore);

    // State
    let brainState = 'idle'; // idle, listening, thinking, speaking
    let brainIntensity = 0;
    let targetIntensity = 0;
    let time = 0;

    // ═══════════════ PARTICLES ═══════════════
    const particlesCanvas = document.getElementById('particles');
    const pCtx = particlesCanvas.getContext('2d');
    let particlesArray = [];

    function resizeParticles() {
      particlesCanvas.width = window.innerWidth;
      particlesCanvas.height = window.innerHeight;
    }
    resizeParticles();
    window.addEventListener('resize', resizeParticles);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * particlesCanvas.width;
        this.y = particlesCanvas.height + 10;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = -(Math.random() * 0.5 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.3 + 0.1;
        this.hue = 180 + Math.random() * 60; // cyan to blue
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.opacity -= 0.001;
        if (this.y < 0 || this.opacity <= 0) this.reset();
      }
      draw() {
        pCtx.beginPath();
        pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        pCtx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.opacity})`;
        pCtx.fill();
      }
    }

    for (let i = 0; i < 60; i++) {
      const p = new Particle();
      p.y = Math.random() * particlesCanvas.height;
      particlesArray.push(p);
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
      particlesArray.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ═══════════════ BRAIN ANIMATION ═══════════════
    function animateBrain() {
      requestAnimationFrame(animateBrain);
      time += 0.016;

      // Smooth intensity interpolation
      brainIntensity += (targetIntensity - brainIntensity) * 0.05;

      // Core animation
      const breathe = Math.sin(time * 1.5) * 0.1 + 0.3;
      core.material.opacity = 0.1 + brainIntensity * 0.3 + breathe * 0.05;
      core.scale.setScalar(1 + brainIntensity * 0.3 + Math.sin(time * 2) * 0.05);
      core.rotation.y += 0.005;
      core.rotation.x += 0.002;

      innerCore.material.opacity = 0.2 + brainIntensity * 0.4;
      innerCore.scale.setScalar(1 + brainIntensity * 0.2);

      // State-specific colors
      if (brainState === 'thinking') {
        core.material.color.setHSL(0.75, 0.8, 0.6); // purple
        innerCore.material.color.setHSL(0.75, 0.8, 0.6);
      } else if (brainState === 'listening') {
        core.material.color.setHSL(0.45, 0.8, 0.5); // green
        innerCore.material.color.setHSL(0.45, 0.8, 0.5);
      } else if (brainState === 'speaking') {
        core.material.color.setHSL(0.55, 0.8, 0.6); // blue
        innerCore.material.color.setHSL(0.55, 0.8, 0.6);
      } else {
        core.material.color.setHSL(0.52, 0.8, 0.6); // cyan
        innerCore.material.color.setHSL(0.72, 0.8, 0.6); // purple
      }

      // Node animation
      nodePositions.forEach((np, i) => {
        const wave = Math.sin(time * 2 + i * 0.5) * 0.01;
        np.mesh.position.set(
          np.x + wave,
          np.y + Math.cos(time + i) * 0.005,
          np.z + Math.sin(time * 0.7 + i * 0.3) * 0.005
        );
        
        // Pulse based on state
        if (brainState === 'thinking') {
          const pulse = Math.sin(time * 8 + i * 0.3) * 0.5 + 0.5;
          np.mesh.material.opacity = np.baseOpacity + pulse * brainIntensity * 0.5;
        } else if (brainState === 'speaking') {
          const wave2 = Math.sin(time * 4 + i * 0.2) * 0.3 + 0.3;
          np.mesh.material.opacity = np.baseOpacity * (0.5 + wave2 * brainIntensity);
        } else {
          np.mesh.material.opacity = np.baseOpacity * (0.6 + Math.sin(time + i) * 0.1);
        }
      });

      // Connection opacity
      connections.forEach(c => {
        if (brainState === 'thinking') {
          const pulse = Math.sin(time * 6 + c.i * 0.2) * 0.5 + 0.5;
          c.line.material.opacity = c.baseOpacity + pulse * brainIntensity * 0.15;
        } else {
          c.line.material.opacity = c.baseOpacity * (0.5 + Math.sin(time + c.i) * 0.1);
        }
      });

      // Auto rotation
      controls.update();
      renderer.render(scene, camera);
    }
    animateBrain();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = brainContainer.clientWidth / brainContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(brainContainer.clientWidth, brainContainer.clientHeight);
    });

    // Click brain to toggle rotation
    brainCanvas.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
    });

    // ═══════════════ AUTH ═══════════════
    async function getToken() {
      try {
        const resp = await fetch(`${API_BASE}/auth/dev-token`, { method: 'POST' });
        if (resp.ok) {
          const data = await resp.json();
          TOKEN = data.access_token || data.token;
          return TOKEN;
        }
      } catch (e) {
        console.warn('dev-token failed:', e);
      }
      return null;
    }

    async function checkHealth() {
      try {
        const resp = await fetch(`${API_BASE}/health`);
        const data = await resp.json();
        document.getElementById('statusDot').style.background = 'var(--success)';
        document.getElementById('statusText').textContent = `Online • v${data.version || '?'}`;
        return true;
      } catch {
        document.getElementById('statusDot').style.background = 'var(--danger)';
        document.getElementById('statusText').textContent = 'Offline';
        return false;
      }
    }

    // ═══════════════ CHAT ═══════════════
    const chatMessages = document.getElementById('chatMessages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');

    function addMessage(text, isUser = false) {
      if (emptyState) emptyState.remove();
      
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'bot'}`;
      
      const avatar = isUser ? '👤' : '🧠';
      const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      
      div.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div>
          <div class="msg-bubble">${escapeHtml(text)}</div>
          <div class="msg-time">${now}</div>
        </div>
      `;
      
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addTypingIndicator() {
      if (emptyState) emptyState.remove();
      
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <div class="msg-avatar">🧠</div>
        <div>
          <div class="msg-bubble">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage(text) {
      if (!text || !text.trim()) return;
      if (!TOKEN) await getToken();
      
      addMessage(text, true);
      msgInput.value = '';
      sendBtn.disabled = true;
      
      // Brain starts thinking
      brainState = 'thinking';
      targetIntensity = 0.8;
      
      addTypingIndicator();

      try {
        const resp = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${TOKEN}`,
          },
          body: JSON.stringify({ message: text, thread_id: 'ui-main' }),
        });

        if (resp.status === 401) {
          // Token expired, get new one
          await getToken();
          const retry = await fetch(`${API_BASE}/chat`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${TOKEN}`,
            },
            body: JSON.stringify({ message: text, thread_id: 'ui-main' }),
          });
          const data = await retry.json();
          handleChatResponse(data);
        } else {
          const data = await resp.json();
          handleChatResponse(data);
        }
      } catch (e) {
        removeTypingIndicator();
        addMessage(`⚠️ Erro de conexão: ${e.message}`);
        brainState = 'idle';
        targetIntensity = 0;
      }
      
      sendBtn.disabled = false;
    }

    function handleChatResponse(data) {
      removeTypingIndicator();
      
      if (data.status === 'complete' && data.response) {
        brainState = 'speaking';
        targetIntensity = 0.6;
        addMessage(data.response);
        
        // TTS — speak the response
        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(data.response);
          utter.lang = 'pt-BR';
          utter.rate = 1.0;
          utter.onend = () => { brainState = 'idle'; targetIntensity = 0; };
          utter.onerror = () => { brainState = 'idle'; targetIntensity = 0; };
          speechSynthesis.speak(utter);
        } else {
          setTimeout(() => { brainState = 'idle'; targetIntensity = 0; }, 3000);
        }
      } else if (data.status === 'running') {
        addMessage('⏳ Processando... tente novamente em alguns segundos.');
        brainState = 'idle';
        targetIntensity = 0;
      } else if (data.status === 'pending_approval') {
        addMessage(`🔒 Aguardando aprovação: ${data.message || 'ferramenta de alto risco'}`);
        brainState = 'idle';
        targetIntensity = 0;
      } else if (data.detail) {
        addMessage(`⚠️ ${data.detail}`);
        brainState = 'idle';
        targetIntensity = 0;
      } else {
        addMessage(data.response || 'Sem resposta.');
        brainState = 'idle';
        targetIntensity = 0;
      }
    }

    // ═══════════════ STT / MICROPHONE ═══════════════
    const micBtn = document.getElementById('micBtn');

    function initSTT() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micBtn.disabled = true;
        micBtn.title = 'Speech Recognition não suportado neste navegador';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(r => r[0].transcript)
          .join('');
        msgInput.value = transcript;
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        brainState = 'idle';
        targetIntensity = 0;
        
        // Auto-send if we have text
        if (msgInput.value.trim()) {
          sendMessage(msgInput.value.trim());
        }
      };

      recognition.onerror = (event) => {
        console.warn('STT error:', event.error);
        isRecording = false;
        micBtn.classList.remove('recording');
        brainState = 'idle';
        targetIntensity = 0;
        
        if (event.error === 'not-allowed') {
          addMessage('⚠️ Permissão do microfone negada. Verifique as configurações do navegador.');
        }
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        initSTT();
        if (!recognition) return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        isRecording = true;
        micBtn.classList.add('recording');
        brainState = 'listening';
        targetIntensity = 0.5;
        recognition.start();
      }
    });

    // ═══════════════ EVENT LISTENERS ═══════════════
    sendBtn.addEventListener('click', () => sendMessage(msgInput.value.trim()));
    
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(msgInput.value.trim());
      }
    });

    // ═══════════════ INIT ═══════════════
    async function init() {
      await getToken();
      await checkHealth();
      initSTT();
      msgInput.focus();
      
      // Add welcome message
      setTimeout(() => {
        addMessage('Olá! Eu sou o Jefrey, seu assistente AI. Como posso ajudar?');
      }, 500);
    }

    init();
  </script>
</body>
