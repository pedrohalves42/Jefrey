# External Secrets Operator for Kubernetes Secrets Management
# Syncs secrets from external providers (AWS Secrets Manager, Vault, 1Password, etc.) to K8s Secrets
# Apply with: kubectl apply -f k8s/base/external-secrets.yaml
---
# Install External Secrets Operator (run once per cluster)
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
# Example: AWS Secrets Manager SecretStore
# Replace with your provider: Vault, Azure Key Vault, GCP Secret Manager, 1Password, etc.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # CHANGE THIS
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
      # Or use IAM role for service account (IRSA)
      # role: arn:aws:iam::123456789012:role/external-secrets-role
---
# Example: Vault SecretStore (alternative)
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: vault-backend
# spec:
#   provider:
#     vault:
#       server: "https://vault.your-domain.com"
#       path: "secret"
#       version: "v2"
#       auth:
#         kubernetes:
#           mountPath: "kubernetes"
#           role: "external-secrets"
---
# ExternalSecret for Jefrey API secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jefrey-api-secrets
  namespace: jefrey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jefrey-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database
        DATABASE_URL: "{{ .DATABASE_URL }}"
        # Redis
        REDIS_URL: "{{ .REDIS_URL }}"
        # JWT/OAuth
        JWT_SECRET_KEY: "{{ .JWT_SECRET_KEY }}"
        FERNET_KEY: "{{ .FERNET_KEY }}"
        # OAuth Providers
        OAUTH_GOOGLE_CLIENT_ID: "{{ .OAUTH_GOOGLE_CLIENT_ID }}"
        OAUTH_GOOGLE_CLIENT_SECRET: "{{ .OAUTH_GOOGLE_CLIENT_SECRET }}"
        OAUTH_GITHUB_CLIENT_ID: "{{ .OAUTH_GITHUB_CLIENT_ID }}"
        OAUTH_GITHUB_CLIENT_SECRET: "{{ .OAUTH_GITHUB_CLIENT_SECRET }}"
        # MCP
        MCP_OAUTH_TOKENS: "{{ .MCP_OAUTH_TOKENS }}"
        # External APIs
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        TAVILY_API_KEY: "{{ .TAVILY_API_KEY }}"
        ELEVENLABS_API_KEY: "{{ .ELEVENLABS_API_KEY }}"
        # n8n
        N8N_API_KEY: "{{ .N8N_API_KEY }}"
        N8N_ENCRYPTION_KEY: "{{ .N8N_ENCRYPTION_KEY }}"
        # Alerting
        SLACK_WEBHOOK_URL: "{{ .SLACK_WEBHOOK_URL }}"
        PAGERDUTY_KEY: "{{ .PAGERDUTY_KEY }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
  dataFrom:
    - extract:
        key: jefrey/production  # AWS Secrets Manager secret name
---
# ExternalSecret for PostgreSQL (separate for rotation)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: jefrey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_DB: "{{ .POSTGRES_DB }}"
  dataFrom:
    - extract:
        key: jefrey/postgres
---
# ExternalSecret for Redis
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secrets
  namespace: jefrey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: jefrey/redis
---
