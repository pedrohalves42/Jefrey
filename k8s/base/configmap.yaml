# =============================================================================
# KUBERNETES CONFIGMAP - Jefrey Application Config
# Non-sensitive configuration only (secrets in Secret resources)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: jefrey-config
  namespace: jefrey
  labels:
    app: jefrey
    component: config
data:
  # Application settings
  JEFREY_ENV: "production"
  JEFREY_DEBUG: "false"
  JEFREY_VERSION: "1.6.0"

  # Database
  JEFREY_DATABASE__HOST: "postgres"
  JEFREY_DATABASE__PORT: "5432"
  JEFREY_DATABASE__DB: "jefrey"
  JEFREY_DATABASE__USER: "jefrey"
  JEFREY_DATABASE__POOL_SIZE: "10"
  JEFREY_DATABASE__MAX_OVERFLOW: "20"
  JEFREY_DATABASE__ECHO: "false"

  # Redis
  JEFREY_REDIS__HOST: "redis"
  JEFREY_REDIS__PORT: "6379"
  JEFREY_REDIS__DB: "0"

  # LLM (Ollama)
  JEFREY_LLM__PROVIDER: "ollama"
  JEFREY_LLM__MODEL: "qwen2.5:0.5b"
  JEFREY_LLM__BASE_URL: "http://ollama:11434"
  JEFREY_LLM__TEMPERATURE: "0.7"
  JEFREY_LLM__MAX_TOKENS: "4000"

  # Embeddings
  JEFREY_EMBEDDINGS__BASE_URL: "http://ollama:11434"
  JEFREY_EMBEDDINGS__MODEL: "nomic-embed-text"

  # MCP Gateway
  JEFREY_MCP__HOST: "0.0.0.0"
  JEFREY_MCP__PORT: "8001"
  JEFREY_MCP__TRANSPORT: "streamable-http"
  JEFREY_MCP__STATELESS_HTTP: "true"
  JEFREY_MCP__TOOL_TIMEOUT: "30.0"
  JEFREY_MCP_OAUTH_ENABLED: "true"
  JEFREY_MCP_CACHE_TTL: "300"

  # n8n Bridge
  JEFREY_N8N_BASE_URL: "http://n8n:5678"
  JEFREY_N8N_BRIDGE_MODE: "auto"

  # Voice
  JEFREY_VOICE__ENABLED: "true"
  JEFREY_VOICE__STT__PROVIDER: "whisper"
  JEFREY_VOICE__STT__MODEL: "small"
  JEFREY_VOICE__TTS__PROVIDER: "piper"

  # Telemetry
  JEFREY_TELEMETRY__ENABLED: "true"
  JEFREY_TELEMETRY__SERVICE_NAME: "jefrey-mcp"
  JEFREY_TELEMETRY__SAMPLE_RATE: "0.1"
  JEFREY_TELEMETRY__ENABLE_CONSOLE: "false"
  JEFREY_TELEMETRY__METRICS_ENABLED: "true"
  JEFREY_TELEMETRY__METRICS_PATH: "/metrics"

  # Alerting thresholds
  JEFREY_ALERTING__HEALTH_CHECK_INTERVAL_SEC: "30"
  JEFREY_ALERTING__SERVICE_DOWN_FOR_SEC: "60"
  JEFREY_ALERTING__TOOL_LATENCY_P95_WARN_SEC: "10.0"
  JEFREY_ALERTING__TOOL_LATENCY_P95_CRIT_SEC: "30.0"
  JEFREY_ALERTING__OAUTH_INVALID_RATE_WARN_PER_MIN: "10.0"
  JEFREY_ALERTING__CACHE_HIT_RATE_WARN: "0.5"

  # CORS
  JEFREY_API__CORS_ORIGINS: "https://jefrey.example.com"

  # EventBus HMAC
  JEFREY_EVENTBUS__HMAC_KID: "v1"

  # Python
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"