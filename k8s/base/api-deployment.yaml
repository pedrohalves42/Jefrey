# =============================================================================
# KUBERNETES API DEPLOYMENT - Jefrey FastAPI
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: jefrey-api
  namespace: jefrey
  labels:
    app: jefrey
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: jefrey
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jefrey-api
  namespace: jefrey
  labels:
    app: jefrey
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jefrey
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jefrey
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ${JEFREY_API_IMAGE:-jefrey-api:prod}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jefrey-config
            - secretRef:
                name: jefrey-secrets
          env:
            - name: JEFREY_DATABASE__URL
              value: "postgresql+psycopg://$(JEFREY_DATABASE__USER):$(POSTGRES_PASSWORD)@postgres:5432/$(JEFREY_DATABASE__DB)"
            - name: JEFREY_REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: JEFREY_API__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_API__SECRET_KEY
            - name: JEFREY_EVENTBUS__HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_EVENTBUS__HMAC_KEY
            - name: JEFREY_EVENTBUS__HMAC_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_EVENTBUS__HMAC_KEYS_JSON
            - name: JEFREY_OAUTH__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_OAUTH__CLIENT_SECRET
            - name: JEFREY_OAUTH__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_OAUTH__CLIENT_ID
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jefrey
                    - key: component
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname