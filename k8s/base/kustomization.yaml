# =============================================================================
# KUSTOMIZE BASE - Jefrey Kubernetes Manifests
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jefrey

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - mcp-deployment.yaml
  - ollama.yaml
  - n8n.yaml
  - brain2.yaml
  - frontend.yaml
  - monitoring.yaml
  - ingress.yaml
  - network-policies.yaml

commonLabels:
  app: jefrey
  managed-by: kustomize

# Images (overridden in overlays)
images:
  - name: jefrey-api
    newTag: prod
  - name: jefrey-mcp
    newTag: prod
  - name: jefrey-frontend
    newTag: prod

# ConfigMap/Secret generator options
configMapGenerator:
  - name: jefrey-config
    behavior: merge
  - name: grafana-datasources
    behavior: merge
  - name: grafana-dashboards
    behavior: merge
  - name: prometheus-config
    behavior: merge
  - name: prometheus-rules
    behavior: merge
  - name: alertmanager-config
    behavior: merge
  - name: blackbox-config
    behavior: merge

secretGenerator:
  - name: jefrey-secrets
    behavior: merge
    envs:
      - .env.secrets  # Not committed - injected at deploy time

# Replacements for dynamic values
replacements:
  - source:
      kind: ConfigMap
      name: jefrey-config
      fieldPath: data.JEFREY_DATABASE__USER
    targets:
      - select:
          kind: StatefulSet
          name: postgres
        fieldPaths:
          - spec.template.spec.containers[0].env[0].value