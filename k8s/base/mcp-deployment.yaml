# =============================================================================
# KUBERNETES MCP DEPLOYMENT - Jefrey MCP Gateway
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: jefrey
  labels:
    app: jefrey
    component: mcp
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: jefrey
    component: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: jefrey
  labels:
    app: jefrey
    component: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jefrey
      component: mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jefrey
        component: mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 1002
        runAsGroup: 1002
        fsGroup: 1002
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ${JEFREY_MCP_IMAGE:-jefrey-mcp:prod}
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jefrey-config
            - secretRef:
                name: jefrey-secrets
          env:
            - name: JEFREY_DATABASE__URL
              value: "postgresql+psycopg://$(JEFREY_DATABASE__USER):$(POSTGRES_PASSWORD)@postgres:5432/$(JEFREY_DATABASE__DB)"
            - name: JEFREY_REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: JEFREY_EVENTBUS__HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_EVENTBUS__HMAC_KEY
            - name: JEFREY_EVENTBUS__HMAC_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_EVENTBUS__HMAC_KEYS_JSON
            - name: JEFREY_MCP_OAUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: JEFREY_MCP_OAUTH_TOKENS
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jefrey
                    - key: component
                      operator: In
                      values:
                        - mcp
                topologyKey: kubernetes.io/hostname