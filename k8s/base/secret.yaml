# =============================================================================
# KUBERNETES SECRET - Jefrey Sensitive Config (TEMPLATE)
# Apply with: kubectl apply -k k8s/overlays/prod
# Actual values should be injected via External Secrets Operator or Sealed Secrets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jefrey-secrets
  namespace: jefrey
  labels:
    app: jefrey
    component: secrets
type: Opaque
stringData:
  # Database password (injected from Vault/External Secrets)
  POSTGRES_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  # Redis password
  REDIS_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  # API Secret Key (min 32 chars, random)
  JEFREY_API__SECRET_KEY: "REPLACE_WITH_32_CHAR_RANDOM_STRING"
  # EventBus HMAC key
  JEFREY_EVENTBUS__HMAC_KEY: "REPLACE_WITH_HMAC_KEY"
  # EventBus HMAC keys JSON for rotation
  JEFREY_EVENTBUS__HMAC_KEYS_JSON: '{"keys": [{"kid": "v1", "key": "REPLACE_WITH_HMAC_KEY"}]}'
  # OAuth Client Secret (Google)
  JEFREY_OAUTH__CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  # OAuth Client ID
  JEFREY_OAUTH__CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  # MCP OAuth tokens
  JEFREY_MCP_OAUTH_TOKENS: "REPLACE_WITH_MCP_TOKENS"
  # Grafana admin password
  GRAFANA_PASSWORD: "REPLACE_WITH_GRAFANA_PASSWORD"
  # SMTP for Alertmanager
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
  # Slack webhook for Alertmanager
  SLACK_WEBHOOK_URL: "REPLACE_WITH_SLACK_WEBHOOK"
  # PagerDuty key
  PAGERDUTY_KEY: "REPLACE_WITH_PAGERDUTY_KEY"
  # Blackbox probe token
  BLACKBOX_PROBE_TOKEN: "REPLACE_WITH_PROBE_TOKEN"