# =============================================================================
# KUBERNETES BRAIN2 DEPLOYMENT - Jefrey Background Processing
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: jefrey-brain2
  namespace: jefrey
  labels:
    app: jefrey
    component: brain2
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: jefrey
    component: brain2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jefrey-brain2
  namespace: jefrey
  labels:
    app: jefrey
    component: brain2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jefrey
      component: brain2
  template:
    metadata:
      labels:
        app: jefrey
        component: brain2
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: brain2
          image: ${JEFREY_API_IMAGE:-jefrey-api:prod}
          imagePullPolicy: Always
          command:
            - python
            - -m
            - src.jefrey.brain2.service
          envFrom:
            - configMapRef:
                name: jefrey-config
            - secretRef:
                name: jefrey-secrets
          env:
            - name: JEFREY_REDIS__URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -qa brain2 /proc/1/cmdline"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi