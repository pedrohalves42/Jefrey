# =============================================================================
# KUBERNETES N8N DEPLOYMENT - Jefrey Workflow Automation
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: jefrey
  labels:
    app: jefrey
    component: n8n
spec:
  type: ClusterIP
  ports:
    - port: 5678
      targetPort: 5678
      protocol: TCP
      name: http
  selector:
    app: jefrey
    component: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: jefrey
  labels:
    app: jefrey
    component: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jefrey
      component: n8n
  template:
    metadata:
      labels:
        app: jefrey
        component: n8n
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jefrey-config
            - secretRef:
                name: jefrey-secrets
          env:
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "true"
            - name: N8N_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: N8N_BASIC_AUTH_USER
            - name: N8N_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jefrey-secrets
                  key: N8N_BASIC_AUTH_PASSWORD
            - name: WEBHOOK_URL
              value: "https://jefrey.example.com/n8n/"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: jefrey
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi