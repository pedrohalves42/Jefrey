# -----------------------------------------------------------------------------
# BLACKBOX EXPORTER (Meta-monitoring)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: jefrey
  labels:
    app: jefrey
    component: blackbox
spec:
  type: ClusterIP
  ports:
    - port: 9115
      targetPort: 9115
      protocol: TCP
      name: http
  selector:
    app: jefrey
    component: blackbox
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: jefrey
data:
  blackbox.yml: |
    modules:
      http_health_check:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: "ip4"
          method: GET
          valid_status_codes: [200]
          valid_http_versions: ["HTTP/1.1", "HTTP/2"]
          no_follow_redirects: false
          fail_if_ssl: false
          fail_if_not_ssl: false
          tls_config:
            insecure_skip_verify: true
          headers:
            User-Agent: "Jefrey-Blackbox/1.0"
      tcp_connect:
        prober: tcp
        timeout: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: jefrey
  labels:
    app: jefrey
    component: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jefrey
      component: blackbox
  template:
    metadata:
      labels:
        app: jefrey
        component: blackbox
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          imagePullPolicy: IfNotPresent
          args:
            - '--config.file=/etc/blackbox/blackbox.yml'
          ports:
            - containerPort: 9115
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: blackbox-config

# -----------------------------------------------------------------------------
# NODE EXPORTER (DaemonSet)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: jefrey
  labels:
    app: jefrey
    component: node-exporter
spec:
  selector:
    matchLabels:
      app: jefrey
      component: node-exporter
  template:
    metadata:
      labels:
        app: jefrey
        component: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.0
          imagePullPolicy: IfNotPresent
          args:
            - '--path.rootfs=/host'
            - '--collector.systemd'
            - '--collector.processes'
            - '--no-collector.wifi'
          ports:
            - containerPort: 9100
              name: http
              hostPort: 9100
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute

# -----------------------------------------------------------------------------
# CADVISOR (DaemonSet)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: jefrey
  labels:
    app: jefrey
    component: cadvisor
spec:
  selector:
    matchLabels:
      app: jefrey
      component: cadvisor
  template:
    metadata:
      labels:
        app: jefrey
        component: cadvisor
    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.0
          imagePullPolicy: IfNotPresent
          args:
            - '--housekeeping_interval=30s'
            - '--docker_only=true'
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            - name: disk
              mountPath: /dev/disk
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          devices:
            - devicePath: /dev/kmsg
              name: kmsg
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: var-run
          hostPath:
            path: /var/run
        - name: sys
          hostPath:
            path: /sys
        - name: docker
          hostPath:
            path: /var/lib/docker
        - name: disk
          hostPath:
            path: /dev/disk
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute