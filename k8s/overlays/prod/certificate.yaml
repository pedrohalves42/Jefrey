# TLS Certificate for Production
# Apply with: kubectl apply -k k8s/overlays/prod
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jefrey-tls
  namespace: jefrey
spec:
  secretName: jefrey-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: jefrey.your-domain.com  # CHANGE THIS
  dnsNames:
    - jefrey.your-domain.com
    - api.jefrey.your-domain.com
    - mcp.jefrey.your-domain.com
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days before expiry
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth