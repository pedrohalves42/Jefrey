name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guard-audit-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: jefrey
          POSTGRES_PASSWORD: jefrey
          POSTGRES_DB: jefrey
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U jefrey -d jefrey"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping | grep -q PONG"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install -e .[dev]
          pip install pytest pytest-asyncio httpx redis PyJWT cryptography cachetools packaging
      - name: Metrics cardinality — no user_id label (P5-01 Livro 4 cap5)
        run: |
          grep -rn "labelnames.*user_id" src/ && exit 1 || echo "no user_id label OK"
          grep -rn "Counter.*user_id" src/ | grep -i labelnames && exit 1 || echo "no Counter user_id OK"
      - name: promtool check rules
        run: docker run --rm --entrypoint promtool -v ${{ github.workspace }}/docker/prometheus:/etc/prometheus prom/prometheus:v2.53.0 check rules /etc/prometheus/alerts.yml
      - name: promtool check config
        run: docker run --rm --entrypoint promtool -v ${{ github.workspace }}/docker/prometheus:/etc/prometheus prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
      - name: Grafana lint (json valid + yaml safe_load + no user_id + sum by(le))
        run: |
          python -m json.tool docker/grafana/dashboards/jefrey.json > /dev/null && echo "grafana json OK"
          python -c "import yaml; yaml.safe_load(open('docker/grafana/provisioning/datasources/datasource.yml')); yaml.safe_load(open('docker/grafana/provisioning/dashboards/dashboard.yml')); print('grafana yaml OK')"
          bash -c 'grep -rn "labelnames.*user_id" src/ && { echo "FAIL user_id label cardinality"; exit 1; } || echo "metrics cardinality OK (0 user_id labels)"'
          bash -c 'grep -q "by (le)" docker/grafana/dashboards/jefrey.json && echo "histogram sum by(le) OK" || { echo "FAIL PromQL missing by (le)"; exit 1; }'
          bash -c 'grep -q ""editable": false" docker/grafana/dashboards/jefrey.json && echo "grafana editable false OK" || { echo "FAIL editable not false"; exit 1; }'
          bash -c 'grep -q "orgId: 1" docker/grafana/provisioning/datasources/datasource.yml && echo "datasource orgId OK" || { echo "FAIL datasource orgId"; exit 1; }'
      - name: Prometheus alerts test (6/6 firing drill, Livro4 cap10)
        run: |
          docker run --rm --entrypoint promtool -v ${{ github.workspace }}/docker/prometheus:/etc/prometheus prom/prometheus:v2.53.0 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool -v ${{ github.workspace }}/docker/prometheus:/etc/prometheus prom/prometheus:v2.53.0 test rules /etc/prometheus/tests/alerts_test.yml
      - name: Metrics cardinality + /metrics no user_id + pytest P5 (P5-01/P5-06 L4 cap5 + SWE cap14)
        run: |
          grep -rn "labelnames.*user_id" src/ && { echo "FAIL user_id label cardinality"; exit 1; } || echo "no user_id label OK (cap5)"
          python -c "from prometheus_client import REGISTRY; txt=str(list(REGISTRY.collect())); assert 'user_id' not in txt.lower(), 'user_id em REGISTRY'; print('REGISTRY no user_id OK')"
          python -m pytest tests/test_p5_metrics_cardinality.py tests/test_p5_grafana_dashboards.py tests/test_p5_alerts_drill.py tests/test_p5_audit_fallback.py -q
      - name: Guard 6 greps (fail-closed)
        run: |
          chmod +x scripts/guard_anti_patterns.sh
          bash scripts/guard_anti_patterns.sh
      - name: Audit pessimista prod (0 CRITICO)
        env:
          JEFREY_ENV: prod
          JEFREY_EVENTBUS__HMAC_KEY: "0123456789abcdef0123456789abcdef"
          JEFREY_EVENTBUS__HMAC_KEYS_JSON: '{"v1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
          JEFREY_OAUTH__AUD: jefrey
          JEFREY_OAUTH__ISS: https://auth.jefrey.test
          JEFREY_REDIS__PASSWORD: jefrey_redis_2026
          JEFREY_DATABASE__PASSWORD: jefrey_test_123
          JEFREY_API__SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          JEFREY_API__CORS_ORIGINS: http://localhost:3000
        run: python audit_pessimista.py
      - name: Compile check
        run: python -m compileall -q src
      - name: Pytest -q (P4 suite)
        run: python -m pytest tests -q
      - name: Compose config -q
        run: docker compose config -q
