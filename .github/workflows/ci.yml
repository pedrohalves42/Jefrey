name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile check
        run: python -m compileall -q src
      - name: Metrics cardinality (sem user_id em labelnames)
        run: |
          if grep -rn "labelnames.*user_id" src/; then echo "FAIL user_id label"; exit 1; fi
      - name: Pytest
        run: python -m pytest tests -q --ignore=tests/e2e --ignore=tests/smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Testes da interface
        run: npm test
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        env:
          GRAFANA_PASSWORD: ci-so-para-validar-0123456789abcdef0123456789
          JEFREY_API__SECRET_KEY: ci-so-para-validar-0123456789abcdef0123456789
          JEFREY_DATABASE__PASSWORD: ci-so-para-validar-0123456789abcdef0123456789
          JEFREY_EVENTBUS__HMAC_KEY: ci-so-para-validar-0123456789abcdef0123456789
          JEFREY_REDIS__PASSWORD: ci-so-para-validar-0123456789abcdef0123456789
          N8N_BASIC_AUTH_PASSWORD: ci-so-para-validar-0123456789abcdef0123456789
        run: |
          touch .env  # o compose le o .env (que nao vai para o Git); vazio basta para validar
          docker compose config -q
