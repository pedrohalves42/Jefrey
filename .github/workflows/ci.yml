name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile check
        run: python -m compileall -q src
      - name: Metrics cardinality (sem user_id em labelnames)
        run: |
          if grep -rn "labelnames.*user_id" src/; then echo "FAIL user_id label"; exit 1; fi
      - name: Pytest
        run: python -m pytest tests -q --ignore=tests/e2e --ignore=tests/smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Testes da interface
        run: npm test
      - name: Build
        run: npm run build
