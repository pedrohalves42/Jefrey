# Checagens rapidas antes de cada commit (as mesmas do CI).
# Instalacao: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: compile
        name: compileall src (erro de sintaxe)
        entry: python -m compileall -q src
        language: system
        pass_filenames: false
        always_run: true
      - id: metrics-no-user-id
        name: metricas sem user_id em labelnames (cardinalidade)
        entry: bash -c 'if grep -rn "labelnames.*user_id" src/ --include=*.py; then exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
